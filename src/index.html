<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoIT advanced js homework 01</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <script type="module" src="./main.js" defer></script>
  </head>
  <body>
    <load
      src="./partials/header.html"
      icon-path="./img/sprite.svg#logo"
      highlight-home="active"
    />

    <main>
      <div class="container">
        <h1 class="main-title visually-hidden">Home</h1>
        <form class="form"  action="#" method="GET">
          <label for="search-text" class="visually-hidden">Search images in site</label>
            <input
              type="text"
              name="search-text"
              placeholder="Search images..."
              required
            />
          <button type="submit">Search</button>
        </form>
        <div class="gallery-settings-container">
          <label class="gallery-settings checkbox-label">
            <input type="checkbox" name="gallery-square-items" checked />
            <span class="checkbox-custom">
              <!-- Вбудована SVG-галочка для кращої стилізації та контрасту -->
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <use href="./img/sprite.svg#checkmark" />
              </svg>
            </span>
            Use square gallery items
          </label>

          <label class="checkbox-label">
            <input type="checkbox" name="gallery-show-info" checked/>
            <span class="checkbox-custom">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <use href="./img/sprite.svg#checkmark" />
              </svg>
            </span>
            Show image info
          </label>
        </div>
        <div class="search-results">
          <ul class="gallery"></ul>
          <div class="loader-container">
            <span class="loader"></span>
          </div>
        </div>
      </div>
    </main>
    <button class="scroll-to-top" type="button" aria-label="Back to top">
      <svg class="scroll-to-top-icon" width="48" height="48" aria-hidden="true">
        <use href="./img/sprite.svg#arrow-up"></use>
      </svg>
    </button>
  </body>
</html>
